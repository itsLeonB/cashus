name: CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.json"]
  pull_request:
    branches: [main, dev]
    paths: ["frontend/**", "backend/openapi.json"]

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: frontend
      - run: bun test

  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: frontend
      - run: bun lint

  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: frontend
      - run: bun run build

  audit:
    name: Quality Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: frontend
      - name: Check unused components
        run: bun run scripts/check-unused-components.ts
      - name: Check unused dependencies
        run: bunx depcheck

  openapi-drift:
    name: OpenAPI Codegen Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          working-directory: frontend
      - name: Verify generated API types are up to date with backend/openapi.json
        run: bun run codegen:api:check
