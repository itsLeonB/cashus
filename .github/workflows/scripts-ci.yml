name: Script Checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/dokploy_diagnostics.py"
      - "scripts/test_dokploy_diagnostics.py"
      - "Makefile"
      - ".github/workflows/scripts-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "scripts/dokploy_diagnostics.py"
      - "scripts/test_dokploy_diagnostics.py"
      - "Makefile"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test diagnostics without cloud access
        run: make test-scripts
